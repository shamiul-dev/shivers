<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface-dim":"#cbdbf5","surface-container-highest":"#d3e4fe","on-tertiary-fixed-variant":"#004e5c","secondary-container":"#316bf3","inverse-primary":"#c3c0ff","primary-container":"#4338ca","tertiary-fixed-dim":"#4cd7f6","on-error-container":"#93000a","inverse-on-surface":"#eaf1ff","on-secondary":"#ffffff","error":"#ba1a1a","primary":"#2a14b4","surface-container":"#e5eeff","secondary-fixed-dim":"#b4c5ff","surface-container-low":"#eff4ff","primary-fixed-dim":"#c3c0ff","on-secondary-fixed":"#00174b","on-primary":"#ffffff","background":"#f8f9ff","on-error":"#ffffff","on-secondary-container":"#fefcff","secondary":"#0051d5","outline-variant":"#c7c4d7","on-background":"#0b1c30","tertiary":"#00414d","surface-container-lowest":"#ffffff","error-container":"#ffdad6","on-primary-container":"#c1beff","on-primary-fixed-variant":"#372abf","surface-tint":"#5148d7","surface-container-high":"#dce9ff","on-secondary-fixed-variant":"#003ea8","tertiary-fixed":"#acedff","inverse-surface":"#213145","surface":"#f8f9ff","primary-fixed":"#e3dfff","surface-bright":"#f8f9ff","secondary-fixed":"#dbe1ff","on-primary-fixed":"#100069","on-tertiary-fixed":"#001f26","tertiary-container":"#005a6a","on-tertiary":"#ffffff","on-surface":"#0b1c30","on-surface-variant":"#464554","on-tertiary-container":"#4ad5f4","outline":"#777586","surface-variant":"#d3e4fe"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-lg":"1.25rem","space-xl":"1.5rem","margin-desktop":"2rem","space-base":"1rem","space-xs":"0.25rem",margin:"1rem","space-3xl":"3rem","gutter-desktop":"1.5rem",gutter:"1rem","space-2xs":"0.125rem","space-2xl":"2rem","space-sm":"0.5rem","space-md":"0.75rem"},fontFamily:{"body-sm":["Plus Jakarta Sans"],"title-sm":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],caption:["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"title-md":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"]},fontSize:{"body-sm":["13px",{lineHeight:"18px",letterSpacing:"0em",fontWeight:"400"}],"title-sm":["14px",{lineHeight:"20px",letterSpacing:"-0.005em",fontWeight:"600"}],"headline-lg":["24px",{lineHeight:"32px",letterSpacing:"-0.02em",fontWeight:"600"}],"label-sm":["11px",{lineHeight:"14px",letterSpacing:"0.02em",fontWeight:"500"}],"label-md":["12px",{lineHeight:"16px",letterSpacing:"0.01em",fontWeight:"600"}],"headline-xl-mobile":["28px",{lineHeight:"36px",letterSpacing:"-0.02em",fontWeight:"700"}],caption:["10px",{lineHeight:"13px",letterSpacing:"0.03em",fontWeight:"500"}],"body-md":["15px",{lineHeight:"22px",letterSpacing:"0em",fontWeight:"400"}],"title-md":["16px",{lineHeight:"22px",letterSpacing:"-0.01em",fontWeight:"600"}],"headline-md":["20px",{lineHeight:"28px",letterSpacing:"-0.015em",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"24px",letterSpacing:"-0.005em",fontWeight:"400"}],"headline-xl":["36px",{lineHeight:"44px",letterSpacing:"-0.03em",fontWeight:"700"}]}}}}</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface antialiased pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-2xl">
<!-- Subtle decorative ambient backdrop elements -->
<div class="relative w-full max-w-md mx-auto pt-space-md">
<!-- Top Branding Block -->
<div class="flex flex-col items-center text-center mb-space-xl">
<!-- App Icon with tactile glow -->
<div class="relative mb-space-md group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary-container rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-300"></div>
<div class="relative w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary to-secondary-container flex items-center justify-center shadow-md shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">forum</span>
</div>
</div>
<!-- Sync Platform Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm shadow-sm mb-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container animate-pulse"></span>
<span>Pulse Web • Mobile Sync</span>
</div>
<!-- Heading & Welcome Subtitle -->
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-background tracking-tight">
        Welcome back
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-2xs">
        Log in to your account to continue chatting
      </p>
</div>
<!-- Main Auth Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm">
<form class="flex flex-col space-y-space-md" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-title-sm text-title-sm text-on-surface" for="emailInput">
            Work or personal email
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
              alternate_email
            </span>
<input class="w-full h-11 pl-11 pr-4 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="emailInput" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-title-sm text-title-sm text-on-surface" for="passwordInput">
              Password
            </label>
<a class="font-label-md text-label-md text-secondary-container hover:underline active:opacity-80" href="#forgot">
              Forgot password?
            </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
              lock
            </span>
<input class="w-full h-11 pl-11 pr-11 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="passwordInput" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 p-1.5 rounded-md text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary focus:ring-0 focus:outline-none cursor-pointer accent-primary" id="rememberDevice" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">
              Remember me for 30 days
            </span>
</label>
</div>
<!-- Primary Submit Button -->
<button class="relative w-full h-11 rounded-full bg-gradient-to-r from-primary to-secondary-container text-on-primary font-title-sm text-title-sm flex items-center justify-center gap-2 shadow-md hover:brightness-105 active:scale-[0.99] transition-all" id="submitBtn" type="submit">
<span>Log In to Pulse</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- QR Code Link Alternative Button -->
<button class="w-full h-11 rounded-full bg-surface-container-low text-on-surface font-title-sm text-title-sm flex items-center justify-center gap-2 hover:bg-surface-container transition-colors active:scale-[0.99]" id="qrCodeBtn" type="button">
<span class="material-symbols-outlined text-secondary-container text-[20px]">qr_code_scanner</span>
<span>Or scan QR code to link device</span>
</button>
</form>
</div>
<!-- Active User Count / Live Team Note -->
<div class="mt-space-md p-space-sm bg-surface-container-low rounded-xl flex items-center justify-between">
<div class="flex items-center gap-2.5">
<div class="flex -space-x-1.5 overflow-hidden">
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-primary font-label-sm text-label-sm">
            AL
          </div>
<div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center text-on-primary font-label-sm text-label-sm">
            MR
          </div>
<div class="w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary font-label-sm text-label-sm">
            TS
          </div>
</div>
<span class="font-caption text-caption text-on-surface-variant">
          2,400+ teammates active now
        </span>
</div>
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
</div>
<!-- Sign Up Callout Footer -->
<div class="text-center mt-space-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
        Don't have an account? 
        <a class="font-title-sm text-title-sm text-primary hover:underline ml-1" href="#signup">
          Sign up
        </a>
</p>
</div>
<!-- Security Trust Badge -->
<div class="mt-space-xl pt-space-md flex flex-col items-center text-center">
<div class="inline-flex items-center gap-1.5 text-on-surface-variant px-3 py-1 rounded-full bg-surface-container">
<span class="material-symbols-outlined text-[15px] text-on-tertiary-fixed-variant" style="font-variation-settings: 'FILL' 1;">
          verified_user
        </span>
<span class="font-label-sm text-label-sm text-on-tertiary-fixed-variant">
          End-to-end encrypted protocol • SOC2 Type II compliant
        </span>
</div>
</div>
</div>
</div>
<script>
  (function() {
    // Password toggle interaction
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Interactive tactile response for submit
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.addEventListener('click', function(e) {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passwordInput').value;
        if (email && pass) {
          const original = submitBtn.innerHTML;
          submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Authenticating...</span>';
          setTimeout(() => {
            submitBtn.innerHTML = original;
          }, 1200);
        }
      });
    }

    // QR scanner button interaction hint
    const qrBtn = document.getElementById('qrCodeBtn');
    if (qrBtn) {
      qrBtn.addEventListener('click', function() {
        const originalText = qrBtn.innerHTML;
        qrBtn.innerHTML = '<span class="material-symbols-outlined text-secondary-container text-[20px]">center_focus_strong</span><span>Ready to scan desktop code</span>';
        setTimeout(() => {
          qrBtn.innerHTML = originalText;
        }, 1800);
      });
    }
  })();
</script></main></body></html>
